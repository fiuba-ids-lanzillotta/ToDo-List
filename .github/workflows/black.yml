name: Black

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  black:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install black
      - run: black --check .
